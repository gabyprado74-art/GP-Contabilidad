<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img"
     aria-label="Reporte financiero con gráfico de barras y una línea de crecimiento">
  <!-- Ilustración sencilla, pensada para sustituirse por una imagen propia.
       Paleta: tinta #16202B, dorado #A8833C, verde #1F5E4C -->

  <!-- Hoja de fondo -->
  <rect x="46" y="28" width="400" height="356" rx="6" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="1.5"/>
  <rect x="46" y="28" width="400" height="46" rx="6" fill="#16202B"/>
  <rect x="46" y="62" width="400" height="12" fill="#16202B"/>

  <!-- Encabezado de la hoja -->
  <circle cx="70" cy="51" r="5" fill="#A8833C"/>
  <rect x="86" y="46" width="118" height="9" rx="4.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="330" y="46" width="90" height="9" rx="4.5" fill="#FFFFFF" opacity="0.35"/>

  <!-- Renglones de datos -->
  <g fill="#E5E2DA">
    <rect x="76" y="100" width="160" height="8" rx="4"/>
    <rect x="76" y="128" width="120" height="8" rx="4"/>
  </g>
  <g fill="#A8833C" opacity="0.55">
    <rect x="316" y="100" width="100" height="8" rx="4"/>
    <rect x="336" y="128" width="80" height="8" rx="4"/>
  </g>
  <line x1="76" y1="156" x2="416" y2="156" stroke="#E5E2DA" stroke-width="1.5"/>

  <!-- Gráfico de barras -->
  <g>
    <rect x="86"  y="286" width="34" height="56"  rx="3" fill="#C9D2D9"/>
    <rect x="142" y="258" width="34" height="84"  rx="3" fill="#C9D2D9"/>
    <rect x="198" y="230" width="34" height="112" rx="3" fill="#1F5E4C"/>
    <rect x="254" y="248" width="34" height="94"  rx="3" fill="#C9D2D9"/>
    <rect x="310" y="204" width="34" height="138" rx="3" fill="#A8833C"/>
    <rect x="366" y="180" width="34" height="162" rx="3" fill="#16202B"/>
  </g>

  <!-- Eje base -->
  <line x1="76" y1="342" x2="416" y2="342" stroke="#16202B" stroke-width="2"/>

  <!-- Línea de crecimiento -->
  <polyline points="103,272 159,244 215,216 271,234 327,190 383,166"
            fill="none" stroke="#A8833C" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="383" cy="166" r="6" fill="#FFFFFF" stroke="#A8833C" stroke-width="2.5"/>

  <!-- Sello / detalle decorativo -->
  <circle cx="430" cy="352" r="34" fill="#FCFBF8" stroke="#A8833C" stroke-width="1.5"/>
  <path d="M430 336v32M422 343h16M422 361h16" stroke="#A8833C" stroke-width="2" stroke-linecap="round"/>
</svg>
